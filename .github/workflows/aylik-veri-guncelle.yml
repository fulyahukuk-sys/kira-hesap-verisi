name: Aylık TÜFE/Yİ-ÜFE Güncelleme (EVDS - DURAKLATILDI)

# DURAKLATILDI (18.08.2026): TCMB, EVDS sistemini "EVDS3" ile yeniledi ve bu
# script'in kullandığı eski herkese açık REST API (basit bir API anahtarıyla
# çalışan evds2.tcmb.gov.tr) kapatıldı. Yeni sistemin veri uç noktası oturum
# çerezi istiyor, belgelenmiş bir API sunmuyor. Bu yüzden zamanlanmış tetikleyici
# kaldırıldı; birincil veri girişi artık Issue Form ile yapılıyor
# (bkz. .github/workflows/oran-girisini-isle.yml). TCMB resmi bir API
# yayınlarsa (aylık kontrol kurulu, bkz. proje notları) fetch-oranlar.mjs
# güncellenip zamanlayıcı burada tekrar açılabilir; "workflow_dispatch" ile
# hâlâ elle denenebilir.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: TÜFE / Yİ-ÜFE verisini çek ve hesapla
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: node otomasyon/fetch-oranlar.mjs

      - name: Değişiklik varsa commitle
        run: |
          if git diff --quiet -- data/oranlar.json; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git config user.name "kira-hesap-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data/oranlar.json
          git commit -m "chore: aylık TÜFE/Yİ-ÜFE verisi güncellendi"
          git push
