name: Oran Girişini İşle

# "Aylık TÜFE / Yİ-ÜFE Oranı Girişi" formuyla (Issues -> New Issue) açılan
# talepleri otomatik işler: data/oranlar.json'u günceller, commit'ler, issue'yu
# başarı notuyla kapatır. Hatalıysa issue'yu AÇIK bırakıp hatayı yorum olarak
# yazar (veri sessizce yanlış yazılmaz).
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  isle:
    # Etiket yerine formun kendi içeriğine bakılıyor: GitHub, şablondaki
    # "labels:" alanını repoda önceden oluşturulmamış etiketler için otomatik
    # eklemeyebiliyor, bu da tetiklemeyi güvenilmez kılıyordu.
    if: contains(github.event.issue.body, '### Ay (bültenin açıklandığı ay)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Formu ayrıştır ve data/oranlar.json'u güncelle
        id: isle
        run: node otomasyon/veri-isle.mjs

      - name: Değişikliği commitle
        run: |
          git config user.name "kira-hesap-botu"
          git config user.email "actions@users.noreply.github.com"
          git add data/oranlar.json
          git commit -m "chore: oran güncellendi (#${{ github.event.issue.number }})"
          git push

      - name: Issue'yu kapat ve bilgilendir
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "✅ Güncellendi: **${{ steps.isle.outputs.ozet }}**\n\nWidget'lar bu veriyi otomatik olarak kullanacak, başka bir işlem yapmanıza gerek yok."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });

      - name: Hata varsa issue'ya yaz (kapatma)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "❌ Bu girişi işlerken bir hata oluştu, veri **güncellenmedi**. Ayrıntılar için: " +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                "Muhtemel neden: girilen sayı formatı ya da ay/yıl seçimi beklenmedik. Bu issue'yu kapatıp doğru değerlerle yeni bir tane açabilirsiniz."
            });
